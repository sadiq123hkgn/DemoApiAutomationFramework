name: Api Test Framework

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "0 18 * * *"
    - cron: "0 3 * * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Execute Tests
      run: mvn clean test -Dsurefire.suiteXmlFiles=suite.xml

    - name: Upload Logs
      uses: actions/upload-artifact@v4
      with:
        name: Logs
        path: logs/
